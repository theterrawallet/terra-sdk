# CI for every push to main and every pull request.
# Actions are pinned to full commit SHAs (the tag is in the comment). The token is read-only.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from packageManager in package.json)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (frozen lockfile; dependency install scripts never run)
        run: pnpm install --frozen-lockfile

      - name: Versions agree
        run: pnpm versions:check

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Size gate (connect core at most 15 KB gzipped)
        run: pnpm size

      - name: SBOMs (CycloneDX per package)
        run: pnpm sbom

      - name: Pack check (exactly what npm would receive)
        run: pnpm pack:check

  audit:
    name: Dependency audit (report)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      # Reported, not blocking: an advisory in a dependency should not stop unrelated work. Review the output.
      - name: pnpm audit (production dependencies)
        continue-on-error: true
        run: |
          status=0
          pnpm audit --prod > audit-prod.txt 2>&1 || status=$?
          cat audit-prod.txt
          { echo "### pnpm audit --prod"; echo '```'; tail -n 40 audit-prod.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: pnpm audit (everything, including dev tools and examples)
        continue-on-error: true
        run: |
          status=0
          pnpm audit > audit-all.txt 2>&1 || status=$?
          cat audit-all.txt
          { echo "### pnpm audit"; echo '```'; tail -n 40 audit-all.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  secrets:
    name: Secret scan (gitleaks 8.30.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks 8.30.1 (checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan the full git history
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --verbose --exit-code 1 .'

      - name: Scan the working tree
        run: '"$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact --verbose --exit-code 1 .'
